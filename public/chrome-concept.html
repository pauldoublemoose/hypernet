<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HYPERNET // CHROME CONCEPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #ffffff; }
  body { font-family: 'VT323', monospace; }
  #stage { position: fixed; inset: 0; }
  .caption {
    position: fixed; top: 18px; left: 22px; z-index: 2;
    color: #000; font-size: 22px; letter-spacing: 2px;
    user-select: none; pointer-events: none;
  }
  .caption .dim { color: #888; font-size: 17px; letter-spacing: 1px; }
  .hint {
    position: fixed; bottom: 18px; left: 22px; z-index: 2;
    color: #888; font-size: 17px; letter-spacing: 1px;
    user-select: none; pointer-events: none;
  }
  .toggle {
    position: fixed; bottom: 16px; right: 18px; z-index: 2;
    font: inherit; font-size: 18px; letter-spacing: 1px;
    color: #000; background: #fff; border: 2px solid #000;
    padding: 8px 16px; cursor: pointer;
  }
  .toggle:hover { background: #000; color: #fff; }
  @media (max-width: 700px) {
    .caption { font-size: 18px; }
    .caption .dim { font-size: 14px; }
    .hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div class="caption">HYPERNET // CHROME CONCEPT<br /><span class="dim">v0.1 — retro-futurist terminal object</span></div>
<div class="hint">DRAG TO ORBIT · AUTO-ROTATE ON</div>
<button class="toggle" id="variantToggle">VARIANT: CHROME</button>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

/* ------------------------------------------------------------------ setup */
const isSmall = matchMedia('(max-width: 700px)').matches
let whiteVariant = isSmall // phone default: white chrome, black on white

const stage = document.getElementById('stage')
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, isSmall ? 1.5 : 2))
renderer.setSize(innerWidth, innerHeight)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
stage.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xffffff)

const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 60)
camera.position.set(3.4, 1.4, 6.4)

const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, 0.1, 0)
controls.enableDamping = true
controls.dampingFactor = 0.06
controls.enablePan = false
controls.autoRotate = true
controls.autoRotateSpeed = 0.9
controls.minDistance = 4
controls.maxDistance = 12
controls.minPolarAngle = 0.55
controls.maxPolarAngle = 1.62

/* studio key light for strong speculars (env map does the reflections) */
const key = new THREE.DirectionalLight(0xffffff, 2.4)
key.position.set(4, 7, 5)
scene.add(key)
const fill = new THREE.DirectionalLight(0xffffff, 0.7)
fill.position.set(-6, 3, -4)
scene.add(fill)

/* -------------------------------------------------------------- materials */
const chromeMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 1.0,
  roughness: 0.03,
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  envMapIntensity: 1.25,
})
const bezelMat = new THREE.MeshStandardMaterial({
  color: 0x050505,
  metalness: 0.4,
  roughness: 0.55,
})

/* ------------------------------------------------------- screen textures */
// Draw pixel-terminal text on canvas; NearestFilter keeps it blocky.
// lines: { t: text, size, invert, align, gap, color }
function makeScreen(widthPx, heightPx, lines, palette) {
  const c = document.createElement('canvas')
  c.width = widthPx
  c.height = heightPx
  const g = c.getContext('2d')
  g.fillStyle = palette.bg
  g.fillRect(0, 0, c.width, c.height)
  // terminal border frame
  g.strokeStyle = palette.fg
  g.lineWidth = 4
  g.strokeRect(8, 8, c.width - 16, c.height - 16)

  let y = 30
  for (const ln of lines) {
    const size = ln.size ?? 34
    y += size + (ln.gap ?? 8)
    g.font = `${size}px "VT323", monospace`
    g.textBaseline = 'alphabetic'
    let x = 28
    if (ln.align === 'center') {
      g.textAlign = 'center'
      x = c.width / 2
    } else {
      g.textAlign = 'left'
    }
    if (ln.invert) {
      const w = g.measureText(ln.t).width
      const bx = ln.align === 'center' ? x - w / 2 : x
      g.fillStyle = palette.fg
      g.fillRect(bx - 8, y - size + 4, w + 16, size + 6)
      g.fillStyle = palette.bg
    } else {
      g.fillStyle = ln.color ?? palette.fg
    }
    g.fillText(ln.t, x, y)
  }
  const tex = new THREE.CanvasTexture(c)
  tex.magFilter = THREE.NearestFilter
  tex.minFilter = THREE.LinearFilter
  tex.colorSpace = THREE.SRGBColorSpace
  tex.anisotropy = 4
  return tex
}

const SCREEN_DEFS = [
  {
    w: 2.9, h: 1.0, px: 928, py: 320,
    lines: [
      { t: 'HYPERNET', size: 150, align: 'center', gap: 26 },
      { t: 'v0.1 // PRE-ALPHA TERMINAL', size: 44, align: 'center', gap: 4 },
    ],
  },
  {
    w: 2.9, h: 1.28, px: 928, py: 410,
    lines: [
      { t: 'WELCOME to pre-alpha HYPERNET!', size: 44, gap: 14 },
      { t: 'HYPERNET is an international network', size: 38, gap: 16 },
      { t: 'of art, tech + experience creators.', size: 38, gap: 6 },
      { t: '', size: 10 },
      { t: '[ SIGN UP ]', size: 44, invert: true, gap: 12 },
    ],
  },
  {
    w: 2.9, h: 1.5, px: 928, py: 480,
    lines: [
      { t: '1 :: CO-CREATOR STATUS', size: 36, gap: 12, color: '#9a9a9a' },
      { t: '> SUBSCRIBER', size: 42, invert: true, gap: 14 },
      { t: '  PROSPECTIVE CO-CREATOR', size: 42, gap: 8 },
      { t: '  KNOWN CO-CREATOR', size: 42, gap: 8 },
      { t: '  LEGACY MEMBER', size: 42, gap: 8 },
    ],
  },
  {
    w: 2.9, h: 0.52, px: 928, py: 166,
    lines: [
      { t: '\u25c6 NAV   \u2191\u2193 MOVE \u00b7 SPACE SELECT \u00b7 ENTER', size: 44, gap: 12 },
    ],
  },
]

/* --------------------------------------------------------------- geometry */
const object = new THREE.Group()
scene.add(object)

const screenMats = [] // rebuilt when variant switches
const MODULE_W = 3.4
const MODULE_D = 0.85
const GAP = 0.055

function buildModule(def) {
  const grp = new THREE.Group()
  const bodyH = def.h + 0.34
  const body = new THREE.Mesh(
    new RoundedBoxGeometry(MODULE_W, bodyH, MODULE_D, 3, 0.045),
    chromeMat,
  )
  grp.add(body)

  // inset bezel
  const bezel = new THREE.Mesh(
    new THREE.BoxGeometry(def.w + 0.1, def.h + 0.1, 0.06),
    bezelMat,
  )
  bezel.position.z = MODULE_D / 2 - 0.005
  grp.add(bezel)

  // screen face
  const mat = new THREE.MeshBasicMaterial()
  screenMats.push({ mat, def })
  const face = new THREE.Mesh(new THREE.PlaneGeometry(def.w, def.h), mat)
  face.position.z = MODULE_D / 2 + 0.026
  grp.add(face)

  grp.userData.bodyH = bodyH
  return grp
}

const modules = SCREEN_DEFS.map(buildModule)
const totalH =
  modules.reduce((s, m) => s + m.userData.bodyH, 0) + GAP * (modules.length - 1)
let cursor = totalH / 2
for (const m of modules) {
  const h = m.userData.bodyH
  m.position.y = cursor - h / 2
  cursor -= h + GAP
  object.add(m)
}
const bottomY = -totalH / 2

/* side accents: chrome spheres + angular elements */
function sphere(r, x, y, z) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32), chromeMat)
  s.position.set(x, y, z)
  object.add(s)
}
sphere(0.42, -2.25, bottomY + 0.42, 0.15)
sphere(0.24, -1.98, bottomY + 1.05, -0.1)
sphere(0.15, -2.35, bottomY + 1.45, 0.2)
sphere(0.3, 2.3, bottomY + 0.3, -0.3)

const octa = new THREE.Mesh(new THREE.OctahedronGeometry(0.42), chromeMat)
octa.position.set(2.25, totalH / 2 - 0.5, 0.1)
octa.rotation.set(0.3, 0.5, 0.15)
object.add(octa)

const prism = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 6), chromeMat)
prism.position.set(2.15, bottomY + 1.35, 0.25)
prism.rotation.set(Math.PI / 2, 0, 0.4)
object.add(prism)

const wedge = new THREE.Mesh(new THREE.TetrahedronGeometry(0.34), chromeMat)
wedge.position.set(-2.15, totalH / 2 - 0.35, -0.2)
wedge.rotation.set(0.7, 0.2, 0.4)
object.add(wedge)

/* soft contact shadow (gradient plane) */
const shadowCanvas = document.createElement('canvas')
shadowCanvas.width = shadowCanvas.height = 256
const sg = shadowCanvas.getContext('2d')
const grad = sg.createRadialGradient(128, 128, 10, 128, 128, 126)
grad.addColorStop(0, 'rgba(0,0,0,0.28)')
grad.addColorStop(0.6, 'rgba(0,0,0,0.10)')
grad.addColorStop(1, 'rgba(0,0,0,0)')
sg.fillStyle = grad
sg.fillRect(0, 0, 256, 256)
const shadowTex = new THREE.CanvasTexture(shadowCanvas)
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(7.5, 7.5),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }),
)
shadow.rotation.x = -Math.PI / 2
shadow.position.y = bottomY - 0.44
scene.add(shadow)

object.position.y = 0.42 // lift so shadow sits under the stack

/* ---------------------------------------------------------------- variant */
const toggleBtn = document.getElementById('variantToggle')

function applyVariant() {
  const palette = whiteVariant
    ? { bg: '#ffffff', fg: '#000000' } // phone: black text/borders on white
    : { bg: '#020202', fg: '#f2f2f2' } // desktop: white on black
  for (const { mat, def } of screenMats) {
    mat.map?.dispose()
    mat.map = makeScreen(def.px, def.py, def.lines, palette)
    mat.needsUpdate = true
  }
  // white chrome: brighter env response, blown highlights
  chromeMat.envMapIntensity = whiteVariant ? 1.9 : 1.25
  renderer.toneMappingExposure = whiteVariant ? 1.3 : 1.05
  bezelMat.color.set(whiteVariant ? 0xffffff : 0x050505)
  bezelMat.metalness = whiteVariant ? 0.1 : 0.4
  toggleBtn.textContent = whiteVariant ? 'VARIANT: WHITE' : 'VARIANT: CHROME'
}

toggleBtn.addEventListener('click', () => {
  whiteVariant = !whiteVariant
  applyVariant()
})

/* ------------------------------------------------------------------- run */
async function start() {
  try {
    await document.fonts.load('80px "VT323"')
    await document.fonts.ready
  } catch { /* font fallback is fine */ }
  applyVariant()
  renderer.setAnimationLoop(() => {
    controls.update()
    renderer.render(scene, camera)
  })
}
start()

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})
</script>
</body>
</html>
